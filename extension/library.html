<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Your recordings</title>
<style>
  :root {
    --paper: #FBF8F3;
    --page: #FFFFFF;
    --page-warm: #FFFCF6;
    --ink: #2B2A26;
    --ink-soft: #6B6558;
    --line: #E3DDD0;
    --accent: #2F5D50;
    --accent-soft: #E7EEEB;
    --live: #B23B2E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 24px 80px;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    font: 26px/1.2 Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 400;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .subhead {
    color: var(--ink-soft);
    margin: 0 0 36px;
    font-size: 14px;
  }

  .empty {
    padding: 40px 0;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
  }

  .rec {
    display: flex;
    border-top: 1px solid var(--line);
    padding: 22px 0;
    gap: 16px;
  }

  .rec:last-child {
    border-bottom: 1px solid var(--line);
  }

  .rec-bar {
    width: 3px;
    border-radius: 2px;
    background: var(--line);
    flex-shrink: 0;
  }

  .rec.has-walkthrough .rec-bar {
    background: var(--accent);
  }

  .rec-body {
    flex: 1;
    min-width: 0;
  }

  .rec-title {
    font: 18px/1.3 Georgia, "Iowan Old Style", "Times New Roman", serif;
    margin: 0 0 4px;
  }

  .rec-meta {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 14px;
  }

  .rec-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  button {
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 7px 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--page);
    color: var(--ink);
    cursor: pointer;
  }

  button:hover { border-color: #C9C1AF; }
  button:disabled { opacity: 0.5; cursor: default; }

  .rec-actions .primary {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  .rec-actions .primary:hover { border-color: var(--accent); }

  audio {
    display: none;
    width: 100%;
    margin-top: 12px;
  }

  .page-panel {
    display: none;
    margin-top: 18px;
    background: var(--page-warm);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px 28px;
    animation: unfold 180ms ease;
  }

  @keyframes unfold {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .page-panel h3 {
    font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 600;
    margin: 0 0 12px;
    color: var(--ink-soft);
  }

  .page-panel .body-text {
    font: 16px/1.7 Georgia, "Iowan Old Style", "Times New Roman", serif;
    max-width: 62ch;
    white-space: pre-wrap;
    color: var(--ink);
  }

  .followup-row {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 8px;
  }

  .followup-row input {
    flex: 1;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--page);
    color: var(--ink-soft);
  }

  .followup-row input::placeholder { color: #A79E8C; }
</style>
</head>
<body>
  <div class="page">
    <h1>Your recordings</h1>
    <p class="subhead">Recorded independently, kept on this device.</p>
    <div id="rec-list"></div>
  </div>
  <script src="library.js"></script>
</body>
</html>
